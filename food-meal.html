<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="dns-prefetch" href="//cdn.jsdelivr.net">

<title>Méthode Tee — Ajouter un repas</title></head>
<body class="food-page"><div class="shell">
<header class="topbar"><a class="logo" href="index.html"><img src="assets/brand-logo.png" alt="Méthode Tee"></a><div id="topActions" class="top-actions"></div></header>
<main class="page mt-food-page" id="foodMealPage">
  <div class="mt-food-subhead"><button class="mt-food-back" id="mealBack" aria-label="Retour">‹</button><div><div class="kicker">Carnet personnel</div><h1 class="mt-food-subtitle" id="mealPageTitle">Ajouter un repas</h1></div><button class="mt-food-text-btn" id="mealSaveTop">Enregistrer</button></div>
  <section class="mt-food-form-card"><label class="mt-food-label">Moment du repas</label><div class="mt-food-type-grid" id="mealTypeGrid"></div></section>
  <section class="mt-food-form-card"><div class="mt-food-row"><label class="mt-food-label">Heure</label><input id="mealTime" type="time" class="mt-food-time"></div></section>
  <section class="mt-food-form-card"><label class="mt-food-label" for="mealDescription">Qu’as-tu mangé ?</label><textarea id="mealDescription" class="mt-food-textarea" rows="4" placeholder="Décris simplement ton repas ou ajoute les aliments ci-dessous."></textarea></section>
  <section class="mt-food-form-card"><label class="mt-food-label">Photo du repas <small>facultatif</small></label><div class="mt-food-photo-row"><div id="mealPhotoPreview" class="mt-food-photo-preview"><span>Aucune photo</span></div><label class="mt-food-photo-btn">Prendre / choisir une photo<input id="mealPhotoInput" type="file" accept="image/*" capture="environment" hidden></label></div></section>
  <section class="mt-food-form-card"><label class="mt-food-label" for="foodSearchInput">Ajouter des aliments</label><div class="mt-food-search"><input id="foodSearchInput" autocomplete="off" placeholder="Rechercher un aliment"><span>⌕</span></div><div id="foodSearchResults" class="mt-food-search-results" hidden></div><div id="mealItems" class="mt-food-items"></div></section>
  <section class="mt-food-form-card"><div class="mt-food-label">Comment je me sens après ce repas ? <small>facultatif</small></div><div class="mt-food-feelings" id="mealFeelings"></div></section>
  <button class="main-cta mt-food-save" id="mealSave">Enregistrer le repas</button><button class="mt-food-delete" id="mealDelete" hidden>Supprimer ce repas</button>
