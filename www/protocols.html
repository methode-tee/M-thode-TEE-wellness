<section class="mt-premium-filter-zone visible" data-premium-filter="protocol">
<div class="mt-filter-inner" id="protocolFilters">

<button type="button" class="mt-filter-pill" data-filter-key="cycle"><span>Cycle</span><small>Féminin</small></button>
<button type="button" class="mt-filter-pill" data-filter-key="douleurs"><span>Douleurs</span><small>Soulagement</small></button>
</div>
</section>
</div>
<script>
(function(){
  var category=new URLSearchParams(location.search).get('category')||'pharmacie_vegetale';
  if(category!=='objectifs_corps') return;
  var box=document.getElementById('protocolFilters');
  if(!box) return;
  box.innerHTML=''
    +'<button type="button" class="mt-filter-pill is-active" data-filter-key="all"><span>Tout</span><small>Tous</small></button>'
    +'<button type="button" class="mt-filter-pill" data-filter-key="silhouette"><span>Silhouette</span><small>Courbe</small></button>'
    +'<button type="button" class="mt-filter-pill" data-filter-key="tonus"><span>Tonus</span><small>Activation</small></button>'
    +'<button type="button" class="mt-filter-pill" data-filter-key="force"><span>Force</span><small>Muscles</small></button>'
    +'<button type="button" class="mt-filter-pill" data-filter-key="routine"><span>Routine</span><small>Constance</small></button>';
})();
</script><section class="protocol-grid" id="protocolGrid" aria-live="polite"></section></main>
